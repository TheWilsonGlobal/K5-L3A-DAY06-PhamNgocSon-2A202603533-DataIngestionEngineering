services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg16
    environment:
      POSTGRES_DB: day6_lab
      POSTGRES_USER: day6
      POSTGRES_PASSWORD: day6_local_only
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      # init.sql bind mount removed: Docker Desktop on this machine rejects the
      # single-file mount ("invalid volume specification"). PgVectorStore.create_schema()
      # runs CREATE EXTENSION IF NOT EXISTS vector instead (same effect).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U day6 -d day6_lab"]
      interval: 3s
      timeout: 3s
      retries: 30
volumes:
  pg_data:
